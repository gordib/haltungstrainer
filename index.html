<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>Haltungs-Training</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<style>
/* Design system: "quiet luxury" tokens — verbatim from Gordian's Simple Currency Converter PWA
   (codified in Weft DESIGN.md §2). Light default, dark via [data-theme="dark"]. */
:root{
  --bg:#f7f6f3;--surface:#ffffff;--text:#1a1a1e;--muted:#6b6b76;--faint:#9a9aa3;
  --line:rgba(26,26,30,.1);--line-strong:rgba(26,26,30,.16);
  --accent:#5b5ce0;--accent-soft:rgba(91,92,224,.12);--on-accent:#fff;
  --warn:#9a7b4a;--danger:#b85c5c;--ok:#4f7a62;
  --tap:44px;--ease:160ms cubic-bezier(.2,0,0,1);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
}
[data-theme="dark"]{
  --bg:#0a0a0c;--surface:#111114;--text:#f4f4f5;--muted:#8a8a93;--faint:#5c5c66;
  --line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.14);
  --accent:#8b8cf0;--accent-soft:rgba(139,140,240,.14);--on-accent:#0a0a0c;
  --warn:#c4a574;--danger:#d49090;--ok:#8aaf9a;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;font-weight:500;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.screen{display:none;flex-direction:column;min-height:100vh;min-height:100dvh;max-width:480px;margin:0 auto;
  padding:calc(12px + var(--safe-t)) calc(20px + var(--safe-r)) calc(16px + var(--safe-b)) calc(20px + var(--safe-l))}
.screen.on{display:flex}
.label{font-size:11px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 0 8px}
.meta{font-size:12px;line-height:16px;color:var(--muted)}
h1{font-size:20px;line-height:26px;letter-spacing:-.01em;font-weight:500;margin:8px 0 2px}
.sub{color:var(--muted);margin:0;font-size:13px;line-height:18px}
/* chips (single-select) */
.chips{display:grid;gap:8px}
.chips.c4{grid-template-columns:repeat(4,1fr)} .chips.c3{grid-template-columns:repeat(3,1fr)}
.chip{min-height:52px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--text);font-size:16px;font-variant-numeric:tabular-nums;transition:background var(--ease),color var(--ease),border-color var(--ease)}
.chip.sel{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chips.c3 .chip{min-height:44px;font-size:14px}
.wkinfo{color:var(--muted);font-size:13px;line-height:18px;min-height:36px;margin-top:10px}
/* rows */
.list{border-top:1px solid var(--line);margin:0;padding:0;list-style:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.row .meta{text-align:right}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{opacity:0;width:100%;height:100%;position:absolute;margin:0;z-index:2;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line-strong);transition:background var(--ease)}
.sw span:after{content:"";position:absolute;width:26px;height:26px;left:3px;top:3px;border-radius:50%;background:var(--surface);border:1px solid var(--line);transition:left var(--ease)}
.sw input:checked+span{background:var(--accent)} .sw input:checked+span:after{left:23px;border-color:transparent}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border-radius:12px;border:1px solid transparent;font-size:18px;transition:background var(--ease),opacity var(--ease)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:active{opacity:.85}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line-strong)}
.btn.ghost:active{background:var(--line)}
.startbar{margin-top:auto;position:sticky;bottom:0;background:var(--bg);padding:16px 0 calc(4px + var(--safe-b));border-top:1px solid var(--line);margin-left:-20px;margin-right:-20px;padding-left:20px;padding-right:20px}
#start{padding-bottom:0}
.total{text-align:center;color:var(--muted);margin-top:10px;font-size:12px;font-variant-numeric:tabular-nums}
.note{font-size:12px;line-height:16px;color:var(--muted);margin-top:8px;text-align:center}
/* run screen */
.top{display:flex;align-items:center;gap:8px;min-height:var(--tap)}
.top .lbl{flex:1;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.icon{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;padding:0}
.icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.bar{height:2px;background:var(--line);overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.media{position:relative;border-radius:12px;overflow:hidden;background:#eceae6;border:1px solid var(--line);aspect-ratio:4/3}
.media img{width:100%;height:100%;object-fit:cover;display:block}
[data-theme="dark"] .media img{filter:brightness(.9)}
.media img.flip{transform:scaleX(-1)}
.badge{position:absolute;left:10px;top:10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:var(--surface);color:var(--text);border:1px solid var(--line)}
.badge.prep{background:var(--accent);color:var(--on-accent);border-color:transparent}
.name{font-size:26px;line-height:31px;letter-spacing:-.015em;margin:16px 0 2px}
.side{font-size:15px;color:var(--accent);min-height:21px}
.cue{font-size:15px;line-height:21px;color:var(--muted);margin:6px 0 0;min-height:42px}
.clock{display:flex;align-items:flex-end;justify-content:space-between;margin-top:10px;gap:12px}
.big{font-size:104px;line-height:.92;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.04em;transition:color var(--ease)}
.big.last{color:var(--accent)}
.rep{text-align:right}
.rep .n{font-size:28px;line-height:34px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rep .ph{font-size:15px;color:var(--muted);min-height:21px}
.sbar{height:4px;background:var(--line);border-radius:999px;overflow:hidden;margin:14px 0 0}
.sbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}
.sbar.prep i{background:var(--muted)}
.ctr{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;margin-top:auto;padding-top:16px}
.ctr button{min-height:72px;border-radius:12px;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid var(--line-strong);background:transparent;color:var(--text)}
.ctr button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ctr button:active{background:var(--line)}
.ctr .pp{background:var(--accent);color:var(--on-accent);border-color:transparent;font-size:17px}
.ctr .pp:active{opacity:.85;background:var(--accent)}
.done{justify-content:center}
.done .big{font-size:56px;color:var(--accent)}
.done p{color:var(--muted);font-size:15px;margin:4px 0 24px}
.done .btn+.btn{margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<!-- START -->
<section class="screen on" id="start">
  <h1>Haltungs-Training</h1>
  <p class="sub">6 Übungen, freihändig. Start drücken und mitmachen.</p>
  <div class="label">Woche</div>
  <div class="chips c4" id="weeks" role="radiogroup" aria-label="Woche"></div>
  <div class="wkinfo" id="wkinfo"></div>
  <div class="label">Optionen</div>
  <div class="list">
    <label class="row">Plank statt Dead Bug<span class="sw"><input type="checkbox" id="optPlank"><span></span></span></label>
    <label class="row">Sprachansagen<span class="sw"><input type="checkbox" id="optVoice" checked><span></span></span></label>
    <label class="row">Töne<span class="sw"><input type="checkbox" id="optSound" checked><span></span></span></label>
  </div>
  <div class="label">Darstellung</div>
  <div class="chips c3" id="themes" role="radiogroup" aria-label="Darstellung"></div>
  <div class="label">Ablauf</div>
  <ul class="list" id="plist"></ul>
  <div class="startbar">
    <button class="btn primary" id="playBtn" aria-label="Start">Start</button>
    <div class="total" id="total"></div>
    <div class="note">iPhone: Lautlos-Schalter aus, damit Ansagen hörbar sind. Bei Schmerzen, Taubheit oder Schwindel abbrechen.</div>
  </div>
</section>
<!-- RUN -->
<section class="screen" id="run">
  <div class="top">
    <button class="icon" id="exitBtn" aria-label="Beenden"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="lbl" id="stepLbl">Übung 1/6</div>
    <button class="icon" id="muteBtn" aria-label="Ton an/aus"><svg viewBox="0 0 24 24" id="muteSvg"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
  </div>
  <div class="bar"><i id="totBar"></i></div>
  <div class="media"><img id="gif" alt=""><div class="badge" id="badge">Los</div></div>
  <div class="name" id="exName"></div>
  <div class="side" id="exSide"></div>
  <div class="cue" id="exCue"></div>
  <div class="clock">
    <div class="big" id="big">0</div>
    <div class="rep"><div class="n" id="repN"></div><div class="ph" id="repPh"></div></div>
  </div>
  <div class="sbar" id="sbarW"><i id="sbar"></i></div>
  <div class="ctr">
    <button id="backBtn" aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="M18 6v12M15 12L5 6v12z" transform="scale(-1,1) translate(-24,0)"/></svg>Zurück</button>
    <button class="pp" id="pauseBtn" aria-label="Pause">Pause</button>
    <button id="skipBtn" aria-label="Weiter"><svg viewBox="0 0 24 24"><path d="M18 6v12M15 12L5 6v12z"/></svg>Weiter</button>
  </div>
</section>
<!-- DONE -->
<section class="screen done" id="done">
  <div class="big">Geschafft</div>
  <p id="doneTxt"></p>
  <button class="btn primary" id="againBtn">Nochmal</button>
  <button class="btn ghost" id="homeBtn">Zur Übersicht</button>
</section>

<script>
(() => {
'use strict';
const Q = new URLSearchParams(location.search);
const SPEED = Math.max(0.1, Number(Q.get('speed')) || 1);
const $ = id => document.getElementById(id);
const GIF = n => 'assets/' + n + '.gif';
window.__log = [];
const log = (type, data) => window.__log.push(Object.assign({type, i: S.idx, t: +(performance.now() / 1000).toFixed(2)}, data || {}));

// ---------------------------------------------------------------- exercises
const EX = {
  chin:   {name: 'Kinn-Rückzug', gif: 'chin_tuck', cue: 'Kopf gerade nach hinten schieben, Doppelkinn machen. Blick bleibt geradeaus.', prep: 'Aufrecht hinstellen oder hinsetzen.'},
  door:   {name: 'Türrahmen-Brustdehnung', gif: 'doorway_stretch', cue: 'Unterarme an den Türrahmen, Ellbogen auf Schulterhöhe. Nach vorn lehnen, bis die Brust dehnt.', prep: 'Stell dich in einen Türrahmen.'},
  wall:   {name: 'Wandengel', gif: 'wall_angels', cue: 'Kopf, oberer Rücken und Po an der Wand. Arme langsam hoch und runter gleiten lassen.', prep: 'Mit dem Rücken an eine Wand stellen.'},
  hip:    {name: 'Hüftbeuger-Dehnung', gif: 'hip_flexor_stretch', cue: 'Becken einrollen, Po anspannen, Hüfte nach vorn schieben. Oberkörper aufrecht.', prep: 'In den Halbkniestand gehen.'},
  bridge: {name: 'Beckenheben', gif: 'glute_bridge', cue: 'Füße flach, Po anspannen, Hüfte heben bis Schultern, Hüfte und Knie eine Linie bilden.', prep: 'Auf den Rücken legen, Knie anstellen.'},
  bug:    {name: 'Dead Bug', gif: 'dead_bug', cue: 'Unterer Rücken bleibt am Boden. Gegenüberliegenden Arm und Bein ausstrecken, dann zurück.', prep: 'Auf den Rücken legen, Arme und Beine nach oben.'},
  plank:  {name: 'Unterarmstütz (Plank)', gif: 'plank', cue: 'Unterarme unter den Schultern, Körper gerade wie ein Brett, Po und Bauch anspannen.', prep: 'Auf die Unterarme gehen.'}
};
const WEEKS = {
  1: 'Lernen: 1 Runde, langsam und sauber. Ziel 5 Tage.',
  2: 'Täglich: gleiche Runde, 6–7 Tage die Woche.',
  3: 'Aufbauen: Dehnungen 45 s, Beckenheben und Dead Bug je 2 Sätze.',
  4: 'Steigern: wie Woche 3, plus 4 s halten beim Beckenheben, langsamer Dead Bug, 12 Wandengel.'
};

// rep phases: [label, seconds] ; soft tick at each phase change after the first
function buildPlan(week, plank) {
  const w3 = week >= 3, w4 = week >= 4;
  const hold = w3 ? 45 : 30;
  const P = [];
  const prep = (ex, secs, extra) => P.push(Object.assign({kind: 'prep', ex, dur: secs}, extra || {}));
  const timed = (ex, secs, extra) => P.push(Object.assign({kind: 'work', ex, dur: secs}, extra || {}));
  const reps = (ex, n, phases, extra) => {
    const rd = phases.reduce((a, p) => a + p[1], 0);
    P.push(Object.assign({kind: 'work', ex, reps: n, repDur: rd, phases, dur: n * rd}, extra || {}));
  };
  // 1 chin tuck
  prep('chin', 15, {first: true});
  reps('chin', 10, [['Zurück schieben', 1], ['Halten', 3], ['Lösen', 1]]);
  // 2 doorway
  prep('door', 15);
  timed('door', hold, {set: '1/2'});
  prep('door', 10, {set: '2/2', say: 'Kurz lockern. Gleich Satz 2.'});
  timed('door', hold, {set: '2/2'});
  // 3 wall angels
  prep('wall', 15);
  reps('wall', w4 ? 12 : 10, [['Hoch', 3], ['Runter', 3]]);
  // 4 hip flexor
  prep('hip', 15, {side: 'Linkes Knie unten', sideKey: 'L'});
  timed('hip', hold, {side: 'Linkes Knie unten', sideKey: 'L'});
  prep('hip', 10, {side: 'Rechtes Knie unten', sideKey: 'R', say: 'Seite wechseln. Rechtes Knie nach unten.'});
  timed('hip', hold, {side: 'Rechtes Knie unten', sideKey: 'R'});
  // 5 bridge
  const bph = w4 ? [['Hoch', 1.5], ['Halten', 4], ['Runter', 1.5]] : [['Hoch', 1.5], ['Halten', 2], ['Runter', 1.5]];
  const sets = w3 ? 2 : 1;
  for (let s = 1; s <= sets; s++) {
    prep('bridge', s === 1 ? 15 : 10, sets > 1 ? {set: s + '/' + sets, say: s > 1 ? 'Kurze Pause. Gleich Satz ' + s + '.' : null} : {});
    reps('bridge', 12, bph, sets > 1 ? {set: s + '/' + sets} : {});
  }
  // 6 dead bug / plank
  if (plank) {
    for (let s = 1; s <= 3; s++) {
      prep('plank', s === 1 ? 15 : 10, {set: s + '/3', say: s > 1 ? 'Kurze Pause. Gleich Satz ' + s + '.' : null});
      timed('plank', 30, {set: s + '/3'});
    }
  } else {
    const dph = w4 ? [['Ausstrecken', 3], ['Halten', 1], ['Zurück', 3]] : [['Ausstrecken', 2], ['Halten', 1], ['Zurück', 2]];
    for (let s = 1; s <= sets; s++) {
      prep('bug', s === 1 ? 15 : 10, sets > 1 ? {set: s + '/' + sets, say: s > 1 ? 'Kurze Pause. Gleich Satz ' + s + '.' : null} : {});
      reps('bug', 16, dph, Object.assign({alt: true}, sets > 1 ? {set: s + '/' + sets} : {}));
    }
  }
  // exercise numbering
  const order = []; P.forEach(p => { if (!order.includes(p.ex)) order.push(p.ex); p.exNo = order.indexOf(p.ex) + 1; });
  P.nEx = order.length;
  return P;
}
const fmt = s => { s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const planTotal = P => P.reduce((a, p) => a + p.dur, 0);

// ---------------------------------------------------------------- settings
const store = {
  get(k, d) { try { const v = localStorage.getItem('pt_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pt_' + k, JSON.stringify(v)); } catch (e) {} }
};
const S = {theme: store.get('theme', 'system'), week: store.get('week', 1), plank: store.get('plank', false), voice: store.get('voice', true), sound: store.get('sound', true),
           plan: [], idx: 0, el: 0, running: false, paused: false, last: 0, timer: null, startedAt: 0};

const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme() {
  const t = S.theme === 'system' ? (mq && mq.matches ? 'dark' : 'light') : S.theme;
  if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); else document.documentElement.removeAttribute('data-theme');
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', t === 'dark' ? '#0a0a0c' : '#f7f6f3');
}
if (mq && mq.addEventListener) mq.addEventListener('change', applyTheme);
function chip(label, sel, on) { const b = document.createElement('button'); b.className = 'chip' + (sel ? ' sel' : ''); b.textContent = label; b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', sel); b.onclick = on; return b; }
function renderStart() {
  applyTheme();
  const th = $('themes'); th.innerHTML = '';
  [['light', 'Hell'], ['dark', 'Dunkel'], ['system', 'System']].forEach(([k, l]) => th.appendChild(chip(l, S.theme === k, () => { S.theme = k; store.set('theme', k); renderStart(); })));
  const wk = $('weeks'); wk.innerHTML = '';
  for (let w = 1; w <= 4; w++) {
    wk.appendChild(chip(String(w), w === S.week, () => { S.week = w; store.set('week', w); renderStart(); }));
  }
  $('wkinfo').textContent = WEEKS[S.week];
  $('optPlank').checked = S.plank; $('optVoice').checked = S.voice; $('optSound').checked = S.sound;
  const P = buildPlan(S.week, S.plank);
  const per = {}; P.forEach(p => { if (p.kind === 'work') per[p.ex] = (per[p.ex] || 0) + p.dur; });
  const desc = {chin: () => '10 Wdh.', door: () => '2 × ' + (S.week >= 3 ? 45 : 30) + ' s', wall: () => (S.week >= 4 ? 12 : 10) + ' Wdh.',
                hip: () => (S.week >= 3 ? 45 : 30) + ' s pro Seite', bridge: () => (S.week >= 3 ? '2 × ' : '') + '12 Wdh.',
                bug: () => (S.week >= 3 ? '2 × ' : '') + '8 pro Seite', plank: () => '3 × 30 s'};
  $('plist').innerHTML = Object.keys(per).map((k, i) => `<li class="row"><span>${i + 1}. ${EX[k].name}</span><span class="meta">${desc[k]()}</span></li>`).join('');
  $('total').textContent = 'Dauer inkl. Wechselpausen: ca. ' + Math.round(planTotal(P) / 60) + ' Min.';
}
$('optPlank').onchange = e => { S.plank = e.target.checked; store.set('plank', S.plank); renderStart(); };
$('optVoice').onchange = e => { S.voice = e.target.checked; store.set('voice', S.voice); if (!S.voice) stopVoice(); updMute(); };
$('optSound').onchange = e => { S.sound = e.target.checked; store.set('sound', S.sound); updMute(); };

// ---------------------------------------------------------------- audio
let AC = null;
function unlockAudio() {
  try {
    if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
    if (AC) {
      if (AC.state === 'suspended') AC.resume();
      const b = AC.createBuffer(1, 1, 22050), s = AC.createBufferSource(); s.buffer = b; s.connect(AC.destination); s.start(0);
      decodeAll();
    }
  } catch (e) {}
}
function tone(freq, dur, vol, type, when, freq2) {
  if (!S.sound || !AC) return;
  try {
    const t0 = AC.currentTime + (when || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
    if (freq2) o.frequency.exponentialRampToValueAtTime(freq2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || 0.3, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
const SND = {
  count: () => tone(880, 0.13, 0.35, 'sine'),
  end:   () => { tone(660, 0.18, 0.35, 'triangle'); tone(880, 0.18, 0.35, 'triangle', 0.16); tone(1320, 0.35, 0.35, 'triangle', 0.32); },
  go:    () => { tone(990, 0.12, 0.35, 'square'); tone(1320, 0.3, 0.3, 'square', 0.12); },
  rep:   () => tone(1560, 0.06, 0.25, 'square'),
  phase: () => tone(520, 0.09, 0.25, 'sine'),
  done:  () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, 0.3, 'triangle', i * 0.15))
};
// Pre-generated natural voice clips (Piper, de_DE-thorsten-high). manifest: {text: url}
const VC = {map: window.__CLIPS || null, raw: {}, buf: {}, cur: null, curEnd: 0, ready: false};
function loadClips() {
  const go = m => { VC.map = m; Object.entries(m).forEach(([t, u]) => fetch(u).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).then(ab => { VC.raw[t] = ab; if (AC) decodeClip(t); }).catch(e => log('clip-load-fail', {text: t, err: String(e)}))); };
  if (VC.map) go(VC.map);
  else fetch('audio/manifest.json').then(r => r.json()).then(go).catch(e => log('manifest-fail', {err: String(e)}));
}
function decodeClip(t) {
  const ab = VC.raw[t]; if (!ab || VC.buf[t] || !AC) return; delete VC.raw[t];
  const ok = b => { VC.buf[t] = b; }, bad = e => log('clip-decode-fail', {text: t});
  try { const p = AC.decodeAudioData(ab, ok, bad); if (p && p.catch) p.catch(bad); } catch (e) { bad(e); }
}
function decodeAll() { Object.keys(VC.raw).forEach(decodeClip); }
function playClip(text, interrupt) {
  const b = VC.buf[text]; if (!b || !AC) return false;
  try {
    if (interrupt && VC.cur) { try { VC.cur.stop(); } catch (e) {} VC.cur = null; VC.curEnd = 0; }
    const src = AC.createBufferSource(), g = AC.createGain(); g.gain.value = 1.0;
    src.buffer = b; src.connect(g); g.connect(AC.destination);
    const when = Math.max(AC.currentTime, interrupt ? 0 : VC.curEnd);
    src.start(when); VC.cur = src; VC.curEnd = when + b.duration;
    src.onended = () => { if (VC.cur === src) VC.cur = null; };
    log('clip', {text, url: VC.map && VC.map[text]});
    return true;
  } catch (e) { return false; }
}
function stopVoice() { if (VC.cur) { try { VC.cur.stop(); } catch (e) {} VC.cur = null; } VC.curEnd = 0; if ('speechSynthesis' in window) speechSynthesis.cancel(); }
let deVoice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices() || [];
  deVoice = vs.find(v => /^de(-|_)DE/i.test(v.lang) && /Anna|Helena|Markus|Google/i.test(v.name)) || vs.find(v => /^de/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, interrupt) {
  log('say', {text});
  if (!S.voice || !text) return;
  if (playClip(text, interrupt)) return;
  if (!('speechSynthesis' in window)) return;
  log('tts-fallback', {text});
  try {
    if (interrupt && VC.cur) { try { VC.cur.stop(); } catch (e) {} VC.cur = null; }
    if (interrupt) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'de-DE'; if (deVoice) u.voice = deVoice; u.rate = 1.0;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ---------------------------------------------------------------- wake lock
let wl = null;
async function wake() {
  try { if ('wakeLock' in navigator && !wl && document.visibilityState === 'visible') { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch (e) { wl = null; }
}
function unwake() { try { if (wl) wl.release(); } catch (e) {} wl = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.running) wake(); });

// ---------------------------------------------------------------- engine
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0, 0); }
function nextWorkAfter(i) { for (let k = i + 1; k < S.plan.length; k++) if (S.plan[k].kind === 'work') return S.plan[k]; return null; }

function enterStep(i) {
  S.idx = i; S.el = 0;
  const p = S.plan[i];
  if (!p) return finish();
  const ex = EX[p.ex];
  log('step', {kind: p.kind, ex: p.ex, dur: p.dur, reps: p.reps || 0, side: p.sideKey || '', set: p.set || ''});
  const img = $('gif'); const src = GIF(ex.gif);
  if (img.getAttribute('src') !== src) img.setAttribute('src', src);
  img.className = p.sideKey === 'R' ? 'flip' : '';
  $('exName').textContent = (p.kind === 'prep' ? 'Gleich: ' : '') + ex.name;
  $('exSide').textContent = [p.side, p.set ? 'Satz ' + p.set : ''].filter(Boolean).join(' · ');
  $('exCue').textContent = p.kind === 'prep' ? ex.prep + ' ' + ex.cue : ex.cue;
  $('badge').textContent = p.kind === 'prep' ? 'Vorbereiten' : 'Los';
  $('badge').className = 'badge' + (p.kind === 'prep' ? ' prep' : '');
  $('sbarW').className = 'sbar' + (p.kind === 'prep' ? ' prep' : '');
  $('stepLbl').textContent = 'Übung ' + p.exNo + '/' + S.plan.nEx + (p.kind === 'prep' ? ' · Vorbereitung' : '');
  if (p.kind === 'prep') {
    let t;
    if (p.say) t = p.say;
    else {
      const w = nextWorkAfter(i);
      t = (p.first ? 'Los geht\'s. ' : 'Gut gemacht. ') + 'Gleich: ' + ex.name + '. ' + ex.prep;
      if (p.side) t += ' ' + p.side + '.';
      if (w && w.reps) t += ' ' + (w.alt ? (w.reps / 2) + ' pro Seite.' : w.reps + ' Wiederholungen.');
      else if (w) t += ' ' + w.dur + ' Sekunden halten.';
    }
    say(t, true);
  } else {
    SND.go();
    if (p.reps) { SND.rep(); say('1', true); log('rep', {n: 1, of: p.reps}); }
    else say('Los. Halten.', true);
  }
  render();
}
function finish() {
  S.running = false; clearInterval(S.timer); unwake();
  SND.done(); say('Geschafft! Super gemacht.', true); log('finish');
  const real = (performance.now() - S.startedAt) / 1000;
  $('doneTxt').textContent = 'Woche ' + S.week + ' erledigt, ' + fmt(planTotal(S.plan)) + ' Min. Training. Bis morgen!';
  show('done');
}
function advance(prev, now) {
  const p = S.plan[S.idx];
  // last-5-seconds beeps + voice "noch 5 Sekunden" on holds
  const a = Math.ceil(p.dur - prev - 1e-9), b = Math.ceil(p.dur - now - 1e-9);
  for (let k = a - 1; k >= b; k--) {
    if (k >= 1 && k <= 5) { SND.count(); log('beep', {k}); if (k === 5 && p.kind === 'work' && !p.reps && p.dur >= 20) say('Noch 5 Sekunden'); }
  }
  if (p.reps) {
    const r0 = Math.floor(prev / p.repDur), r1 = Math.floor(Math.min(now, p.dur - 1e-6) / p.repDur);
    for (let r = r0 + 1; r <= r1 && r < p.reps; r++) { SND.rep(); say(String(r + 1), true); log('rep', {n: r + 1, of: p.reps}); }
    // phase ticks
    let off = 0;
    p.phases.forEach((ph, j) => {
      if (j > 0) {
        const q0 = Math.floor((prev - off) / p.repDur), q1 = Math.floor((now - off) / p.repDur);
        if (q1 > q0 && now < p.dur) SND.phase();
      }
      off += ph[1];
    });
  }
}
function tick() {
  const t = performance.now();
  const dt = (t - S.last) / 1000 * SPEED; S.last = t;
  if (!S.running || S.paused) return;
  const p = S.plan[S.idx];
  const prev = S.el, now = Math.min(S.el + dt, p.dur);
  advance(prev, now); S.el = now;
  if (S.el >= p.dur - 1e-9) {
    log('end', {ex: p.ex, kind: p.kind});
    if (p.kind === 'work') SND.end();
    enterStep(S.idx + 1);
    return;
  }
  render();
}
function render() {
  const p = S.plan[S.idx]; if (!p) return;
  const rem = Math.max(0, p.dur - S.el);
  const big = $('big'); big.textContent = Math.ceil(rem - 1e-9);
  big.classList.toggle('last', rem <= 5);
  $('sbar').style.width = (100 * S.el / p.dur).toFixed(1) + '%';
  const done = S.plan.slice(0, S.idx).reduce((a, q) => a + q.dur, 0) + S.el;
  $('totBar').style.width = (100 * done / planTotal(S.plan)).toFixed(1) + '%';
  if (p.kind === 'work' && p.reps) {
    const r = Math.min(p.reps, Math.floor(S.el / p.repDur) + 1);
    $('repN').textContent = 'Wdh. ' + r + '/' + p.reps;
    let inRep = S.el - (r - 1) * p.repDur, ph = p.phases[0][0];
    for (const x of p.phases) { if (inRep < x[1]) { ph = x[0]; break; } inRep -= x[1]; }
    $('repPh').textContent = ph;
    if (p.alt) $('exSide').textContent = (r % 2 ? 'Linker Arm + rechtes Bein' : 'Rechter Arm + linkes Bein') + (p.set ? ' · Satz ' + p.set : '');
  } else {
    $('repN').textContent = p.kind === 'prep' ? '' : 'Halten';
    $('repPh').textContent = p.kind === 'prep' ? 'In Position gehen' : '';
  }
}
function start() {
  unlockAudio();
  S.plan = buildPlan(S.week, S.plank);
  S.running = false; S.paused = false; clearInterval(S.timer);
  setPauseLbl(); updMute(); show('run'); wake();
  enterPreview();
  const t0 = performance.now();
  const begin = () => {
    S.running = true; S.last = performance.now(); S.startedAt = S.last;
    S.timer = setInterval(tick, 50);
    log('start', {week: S.week, plank: S.plank, total: planTotal(S.plan), speed: SPEED, clipsReady: Object.keys(VC.buf).length});
    enterStep(0);
  };
  // give the voice clips a moment to finish decoding (first tap creates the AudioContext)
  const wait = () => {
    const n = VC.map ? Object.keys(VC.map).length : 0;
    if (!S.voice || !n || Object.keys(VC.buf).length >= n || performance.now() - t0 > 1500) begin(); else setTimeout(wait, 40);
  };
  wait();
}
function enterPreview() { S.idx = 0; S.el = 0; const ex = EX[S.plan[0].ex]; $('gif').setAttribute('src', GIF(ex.gif)); $('exName').textContent = 'Gleich: ' + ex.name; $('big').textContent = S.plan[0].dur; }
document.addEventListener('pointerdown', unlockAudio, {once: true});
function setPauseLbl() { $('pauseBtn').textContent = S.paused ? 'Fortsetzen' : 'Pause'; }
const SVG_ON = '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>';
const SVG_OFF = '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/>';
function updMute() { $('muteSvg').innerHTML = (S.sound || S.voice) ? SVG_ON : SVG_OFF; }
$('playBtn').onclick = start;
$('againBtn').onclick = start;
$('homeBtn').onclick = () => { renderStart(); show('start'); };
$('pauseBtn').onclick = () => {
  unlockAudio(); S.paused = !S.paused; S.last = performance.now(); setPauseLbl(); log(S.paused ? 'pause' : 'resume');
  if (S.paused) stopVoice();
  if (S.paused) unwake(); else wake();
};
$('skipBtn').onclick = () => { unlockAudio(); if (!S.running) return; log('skip'); enterStep(S.idx + 1); };
$('backBtn').onclick = () => {
  unlockAudio(); if (!S.running) return; log('back');
  if (S.el > 3 || S.idx === 0) enterStep(S.idx); else enterStep(S.idx - 1);
};
$('muteBtn').onclick = () => {
  const on = !(S.sound || S.voice); S.sound = on; S.voice = on; store.set('sound', on); store.set('voice', on);
  if (!on) stopVoice(); updMute();
};
$('exitBtn').onclick = () => {
  if (!confirm('Training beenden?')) return;
  S.running = false; clearInterval(S.timer); unwake(); stopVoice();
  renderStart(); show('start');
};
// preload gifs
Object.values(EX).forEach(e => { const i = new Image(); i.src = GIF(e.gif); });
window.__app = {S, buildPlan, planTotal, VC};
loadClips();
renderStart();
})();
</script>
